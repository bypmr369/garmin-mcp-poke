services:
  - type: web
    name: garmin-mcp-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python src/server.py
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GARMINTOKENS_BASE64
        sync: false
      - key: MCP_SECRET
        sync: false
